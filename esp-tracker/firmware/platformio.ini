; ESP-NOW antenna tracker firmware for ExpressLRS Backpack telemetry.
;
;   pio run -e esp32c3 -t upload      ESP32-C3 (default)
;   pio run -e esp32s2 -t upload      ESP32-S2
;   pio run -e esp32   -t upload      classic ESP32 (e.g. LilyGO TTGO boards)
;   pio device monitor                115200 baud on classic ESP32, USB-CDC on C3/S2
;
; Servo pins are build flags (PIN_PAN / PIN_TILT): check them against YOUR board's pinout.

[platformio]
default_envs = esp32c3

[env]
platform = espressif32@6.9.0   ; Arduino-ESP32 core 2.0.17
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_PAN=4
    -DPIN_TILT=5

[env:esp32s2]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_PAN=5
    -DPIN_TILT=6

[env:esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPIN_PAN=25
    -DPIN_TILT=26
