; ESP-NOW antenna tracker firmware for ExpressLRS Backpack telemetry.
;
;   pio run -e esp32c3 -t upload      ESP32-C3 (default)
;   pio run -e esp32s2 -t upload      ESP32-S2
;   pio run -e esp32   -t upload      classic ESP32 dev board
;   pio run -e ttgo_ts -t upload      LilyGO TTGO TS v1.2 (ESP32 + 1.8" ST7735 screen + 3 buttons)
;   pio device monitor                115200 baud on classic ESP32, USB-CDC on C3/S2
;
; Pins are build flags: PIN_PAN / PIN_TILT (servos), PIN_SDA / PIN_SCL (I2C sensors, optional),
; PIN_GPS_RX / PIN_GPS_TX (GPS module, optional). Check them against YOUR board's pinout.

[platformio]
default_envs = esp32c3

[env]
platform = espressif32@6.9.0   ; Arduino-ESP32 core 2.0.17
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@^3.0.5
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_PAN=4
    -DPIN_TILT=5
    -DPIN_SDA=6
    -DPIN_SCL=7
    -DPIN_GPS_RX=20
    -DPIN_GPS_TX=21

[env:esp32s2]
board = esp32-s2-saola-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPIN_PAN=5
    -DPIN_TILT=6
    -DPIN_SDA=8
    -DPIN_SCL=9
    -DPIN_GPS_RX=18
    -DPIN_GPS_TX=17

[env:esp32]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DPIN_PAN=25
    -DPIN_TILT=26
    -DPIN_SDA=21
    -DPIN_SCL=22
    -DPIN_GPS_RX=16
    -DPIN_GPS_TX=17

; LilyGO TTGO TS v1.2: ST7735 1.8" 128x160 (CS 16, DC 17, MOSI 23, SCLK 5), buttons on 34/35/39,
; I2C on the header (21/22). Free header pins used here: 26 = pan, 33 = tilt, 32 = GPS RX.
; 27 drives the screen backlight on the later TS revisions; it is set high, harmless if unused.
[env:ttgo_ts]
board = esp32dev
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
build_flags =
    ${env.build_flags}
    -DPIN_PAN=26
    -DPIN_TILT=33
    -DPIN_SDA=21
    -DPIN_SCL=22
    -DPIN_GPS_RX=32
    -DPIN_GPS_TX=-1
    -DHAS_TFT=1
    -DPIN_TFT_CS=16
    -DPIN_TFT_DC=17
    -DPIN_TFT_MOSI=23
    -DPIN_TFT_SCLK=5
    -DPIN_TFT_RST=-1
    -DPIN_TFT_BL=27
    -DPIN_BTN1=34
    -DPIN_BTN2=35
    -DPIN_BTN3=39
