# SD card content for EdgeTX radios, extracted to INSTALLDIR/EdgeTX-sdcard
# (copy it to your SD card). Set EDGETX_SDCARD=c480x320 (etc.) to skip the menu.
DESC="EdgeTX SD card : content to copy on the SD card of your radio"
REPO="EdgeTX/edgetx-sdcard"
NAME="EdgeTX-sdcard"
EXTRA_OPTS="-S"

edgetx_sdselect() {
  local a
  [ -n "${EDGETX_SDCARD:-}" ] && { echo "${EDGETX_SDCARD%.zip}.zip"; return 0; }
  while true; do
    printf 'EdgeTX SD card, select your radio screen :\n' >&2
    printf ' 1) Black/White 128x64  (bw128x64)\n' >&2
    printf ' 2) Black/White 212x64  (bw212x64)\n' >&2
    printf ' 3) Color 480x272, e.g. TX16S/T16/X10 (c480x272)\n' >&2
    printf ' 4) Color 320x480       (c320x480)\n' >&2
    printf ' 5) Color 480x320       (c480x320)\n' >&2
    printf ' 6) Color 320x240       (c320x240)\n' >&2
    printf ' 7) Color 800x480       (c800x480)\n' >&2
    printf 'Choice [1-7] : ' >&2; read -r a || return 1
    case "${a}" in
      1) echo bw128x64.zip; return 0;; 2) echo bw212x64.zip; return 0;;
      3) echo c480x272.zip; return 0;; 4) echo c320x480.zip; return 0;;
      5) echo c480x320.zip; return 0;; 6) echo c320x240.zip; return 0;;
      7) echo c800x480.zip; return 0;;
      *) printf 'Please enter a number between 1 and 7\n\n' >&2;;
    esac
  done
}
# called by fpvtools.sh before install/check; sets ASSET and NAME
pre_install() {
  local z; z="$(edgetx_sdselect)" || return 1
  ASSET="^${z}\$"; NAME="EdgeTX-sdcard-${z%.zip}"
}
